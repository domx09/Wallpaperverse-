<script>
const grid=document.getElementById("grid");
const status=document.getElementById("status");
const loadMore=document.getElementById("loadMore");
const searchInput=document.getElementById("search");

let query="wallpaper",page=0,loading=false,selectedImage="";

const imageTerms={
 "4k":"4k wallpaper",
 "cars":"sports car",
 "motorcycle":"motorcycle",
 "anime":"anime illustration",
 "nature":"beautiful nature",
 "gaming":"gaming setup",
 "technology":"technology",
 "space":"galaxy space",
 "football":"football stadium",
 "abstract":"abstract art"
};

function addImages(reset=false){
 if(loading)return;

 loading=true;
 loadMore.disabled=true;
 status.hidden=false;
 status.textContent="Loading beautiful wallpapers...";

 if(reset){
  grid.innerHTML="";
  page=0;
 }

 const term=imageTerms[query]||query;

 for(let i=0;i<20;i++){
  const seed=page*20+i+1;
  const url="https://loremflickr.com/900/1200/"+encodeURIComponent(term)+"?lock="+seed;

  const card=document.createElement("div");
  card.className="wall";

  const img=document.createElement("img");
  img.src=url;
  img.alt=term+" wallpaper";
  img.loading="lazy";
  img.onerror=()=>card.remove();

  const info=document.createElement("div");
  info.className="info";

  const label=document.createElement("span");
  label.textContent="HD • "+term;

  info.appendChild(label);
  card.append(img,info);

  card.addEventListener("click",()=>openPreview(url));
  grid.appendChild(card);
 }

 page++;
 status.textContent="Explore images matching: "+term;
 loadMore.hidden=false;

 loading=false;
 loadMore.disabled=false;
}

function search(){
 query=searchInput.value.trim().toLowerCase()||"4k";
 document.querySelectorAll(".chip").forEach(b=>b.classList.remove("active"));
 addImages(true);
}

function openPreview(url){
 selectedImage=url;
 document.getElementById("preview").src=url;
 document.getElementById("download").href=url;
 document.getElementById("modal").classList.add("open");
}

document.getElementById("searchBtn").addEventListener("click",search);

searchInput.addEventListener("keydown",e=>{
 if(e.key==="Enter")search();
});

loadMore.addEventListener("click",()=>addImages());

document.getElementById("close").addEventListener("click",()=>{
 document.getElementById("modal").classList.remove("open");
});

document.getElementById("modal").addEventListener("click",e=>{
 if(e.target.id==="modal")e.currentTarget.classList.remove("open");
});

document.getElementById("copy").addEventListener("click",async()=>{
 try{
  await navigator.clipboard.writeText(selectedImage);
  document.getElementById("copy").textContent="✓ Link Copied!";
  setTimeout(()=>{
   document.getElementById("copy").textContent="Copy Image Link";
  },1600);
 }catch(e){
  alert("Could not copy link.");
 }
});

document.getElementById("categories").addEventListener("click",e=>{
 const btn=e.target.closest(".chip");
 if(!btn)return;

 document.querySelectorAll(".chip").forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");

 searchInput.value=btn.dataset.query==="4k"?"":btn.dataset.query;
 query=btn.dataset.query;

 addImages(true);
});

addImages(true);
</script>
